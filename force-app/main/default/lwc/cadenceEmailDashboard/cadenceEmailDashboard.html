<template>
    <lightning-card title="Cadence Email Performance" icon-name="standard:email">
        <div class="slds-p-horizontal_medium">

            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <span>{error}</span>
                </div>
            </template>

            <!-- Filters -->
            <div class="slds-grid slds-gutters slds-wrap filter-row">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-combobox
                        name="folder"
                        label="Folder"
                        placeholder="Select a folder"
                        options={folderOptions}
                        value={selectedFolder}
                        onchange={handleFolderChange}
                        disabled={isLoadingOptions}
                    ></lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-input
                        type="search"
                        label="Cadence"
                        placeholder="Search all cadences..."
                        value={cadenceSearchTerm}
                        onchange={handleCadenceSearch}
                        disabled={isLoadingOptions}
                    ></lightning-input>
                    <template if:true={showCadenceList}>
                        <ul class="cadence-list slds-box slds-box_x-small slds-m-top_xx-small">
                            <template for:each={cadenceListForFolder} for:item="cadence">
                                <li
                                    key={cadence.cadenceId}
                                    class={cadence.itemClass}
                                    data-id={cadence.cadenceId}
                                    onclick={handleCadenceSelect}
                                >
                                    {cadence.name}
                                    <template if:true={cadence.showFolder}>
                                        <div class="cadence-item-folder">{cadence.folderName}</div>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </template>
                </div>

                <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
                    <lightning-input
                        type="date"
                        label="Start date"
                        value={startDate}
                        onchange={handleStartDateChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
                    <lightning-input
                        type="date"
                        label="End date"
                        value={endDate}
                        onchange={handleEndDateChange}
                    ></lightning-input>
                </div>
            </div>

            <template if:false={hasCadenceSelected}>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-color_weak">
                    Select a folder, then a cadence, to see its performance.
                </div>
            </template>

            <template if:true={isLoadingData}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <template if:true={hasCadenceSelected}>
                <h2 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">
                    {selectedCadenceName}
                </h2>

                <template if:true={overview}>
                    <!-- KPI tiles — click any tile to drill into its records -->
                    <div class="slds-grid slds-gutters slds-wrap kpi-grid">
                        <div class={sentTileClass} data-filter="sent" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.sent}</div>
                            <div class="kpi-label">Sent</div>
                        </div>
                        <div class={deliveredTileClass} data-filter="delivered" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.delivered}</div>
                            <div class="kpi-label">Delivered</div>
                        </div>
                        <div class={openedTileClass} data-filter="opened" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.opened}</div>
                            <div class="kpi-label">Opened</div>
                        </div>
                        <div class={clickedTileClass} data-filter="clicked" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.clicked}</div>
                            <div class="kpi-label">Clicked</div>
                        </div>
                        <div class={bouncedTileClass} data-filter="bounced" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.bounced}</div>
                            <div class="kpi-label">Bounced</div>
                        </div>
                        <div class={repliedTileClass} data-filter="replied" onclick={handleKpiClick} role="button" tabindex="0">
                            <div class="kpi-value">{overview.replied}</div>
                            <div class="kpi-label">Replied</div>
                        </div>
                    </div>

                    <!-- Donuts -->
                    <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium donut-row">
                        <div class="slds-col slds-size_1-of-2 slds-align_absolute-center donut-tile">
                            <lightning-progress-ring
                                value={openRingValue}
                                size="large"
                                variant="active-step"
                            ></lightning-progress-ring>
                            <div class="donut-label">Open Rate: {overview.openRate}%</div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-align_absolute-center donut-tile">
                            <lightning-progress-ring
                                value={clickRingValue}
                                size="large"
                                variant="active-step"
                            ></lightning-progress-ring>
                            <div class="donut-label">Click Rate: {overview.clickRate}%</div>
                        </div>
                    </div>

                    <!-- Opens over time -->
                    <template if:true={hasOpensOverTime}>
                        <div class="slds-m-top_medium chart-container">
                            <div class="slds-text-title_caps slds-m-bottom_x-small">Opens Over Time</div>
                            <svg viewBox={lineChartViewBox} class="line-chart" preserveAspectRatio="none">
                                <polyline points={lineChartPoints} class="line-chart-line"></polyline>
                            </svg>
                            <div class="slds-text-body_small slds-text-color_weak">{chartRangeLabel}</div>
                        </div>
                    </template>

                    <!-- By rep — click a row to drill into that rep's records -->
                    <template if:true={hasByRep}>
                        <div class="slds-m-top_large">
                            <div class="slds-text-heading_x-small slds-m-bottom_x-small">By Rep</div>
                            <table class="slds-table slds-table_bordered slds-table_striped">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th>Rep</th>
                                        <th>Sent</th>
                                        <th>Opened</th>
                                        <th>Clicked</th>
                                        <th>Replied</th>
                                        <th>Open Rate</th>
                                        <th>Click Rate</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={byRep} for:item="rep">
                                        <tr
                                            key={rep.key}
                                            class={rep.rowClass}
                                            data-rep-id={rep.repId}
                                            data-rep-name={rep.repName}
                                            onclick={handleRepRowClick}
                                        >
                                            <td>{rep.repName}</td>
                                            <td>{rep.sent}</td>
                                            <td>{rep.opened}</td>
                                            <td>{rep.clicked}</td>
                                            <td>{rep.replied}</td>
                                            <td>{rep.openRate}%</td>
                                            <td>{rep.clickRate}%</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                    <!-- Clicked contacts -->
                    <template if:true={hasClickedContacts}>
                        <div class="slds-m-top_large slds-m-bottom_medium">
                            <div class="slds-text-heading_x-small slds-m-bottom_x-small">
                                Clicked a Tracked Link
                            </div>
                            <table class="slds-table slds-table_bordered slds-table_striped">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th>Contact</th>
                                        <th>First Clicked</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={clickedContacts} for:item="cc">
                                        <tr key={cc.key}>
                                            <td>{cc.contactName}</td>
                                            <td>
                                                <lightning-formatted-date-time
                                                    value={cc.firstClickedDate}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit"
                                                    hour="2-digit"
                                                    minute="2-digit"
                                                ></lightning-formatted-date-time>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>

                    <!-- Drill-down panel -->
                    <template if:true={hasDrillDown}>
                        <div class="drill-panel slds-m-top_large slds-m-bottom_medium">
                            <div class="drill-header">
                                <span class="slds-text-heading_x-small">{drillTitle}</span>
                                <div class="drill-header-right">
                                    <template if:true={hasDrillRows}>
                                        <span class="slds-text-body_small slds-text-color_weak slds-m-right_small">{drillRowCount}</span>
                                    </template>
                                    <lightning-button-icon
                                        icon-name="utility:close"
                                        variant="bare"
                                        size="small"
                                        alternative-text="Close"
                                        onclick={closeDrill}
                                    ></lightning-button-icon>
                                </div>
                            </div>

                            <template if:true={isLoadingDrill}>
                                <div class="slds-p-around_medium slds-align_absolute-center">
                                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:true={drillError}>
                                <div class="slds-p-around_small slds-text-color_error">{drillError}</div>
                            </template>

                            <template if:true={hasDrillRows}>
                                <div class="drill-body">
                                    <table class="slds-table slds-table_bordered slds-table_striped slds-table_fixed-layout">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th class="drill-col-contact">Contact</th>
                                                <th class="drill-col-rep">Rep</th>
                                                <th class="drill-col-date">Sent</th>
                                                <th class="drill-col-date">First Opened</th>
                                                <th class="drill-col-date">First Clicked</th>
                                                <th class="drill-col-flag">Bounced</th>
                                                <th class="drill-col-flag">Replied</th>
                                                <th class="drill-col-source">Source</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={drillRows} for:item="row">
                                                <tr key={row.key}>
                                                    <td class="drill-col-contact" title={row.contactName}>
                                                        <template if:true={row.contactUrl}>
                                                            <a href={row.contactUrl} target="_blank" class="drill-contact-link">{row.contactName}</a>
                                                        </template>
                                                        <template if:false={row.contactUrl}>
                                                            {row.contactName}
                                                        </template>
                                                    </td>
                                                    <td class="drill-col-rep" title={row.repName}>{row.repName}</td>
                                                    <td class="drill-col-date">
                                                        <lightning-formatted-date-time
                                                            value={row.sentDate}
                                                            year="numeric"
                                                            month="short"
                                                            day="2-digit"
                                                        ></lightning-formatted-date-time>
                                                    </td>
                                                    <td class="drill-col-date">
                                                        <template if:true={row.firstOpenedDate}>
                                                            <lightning-formatted-date-time
                                                                value={row.firstOpenedDate}
                                                                year="numeric"
                                                                month="short"
                                                                day="2-digit"
                                                            ></lightning-formatted-date-time>
                                                        </template>
                                                        <template if:false={row.firstOpenedDate}>
                                                            <span class="drill-check">—</span>
                                                        </template>
                                                    </td>
                                                    <td class="drill-col-date">
                                                        <template if:true={row.firstClickedDate}>
                                                            <lightning-formatted-date-time
                                                                value={row.firstClickedDate}
                                                                year="numeric"
                                                                month="short"
                                                                day="2-digit"
                                                            ></lightning-formatted-date-time>
                                                        </template>
                                                        <template if:false={row.firstClickedDate}>
                                                            <span class="drill-check">—</span>
                                                        </template>
                                                    </td>
                                                    <td class="drill-col-flag">
                                                        <span class={row.bouncedClass}>{row.bouncedLabel}</span>
                                                    </td>
                                                    <td class="drill-col-flag">
                                                        <span class={row.repliedClass}>{row.repliedLabel}</span>
                                                    </td>
                                                    <td class="drill-col-source">{row.sourceType}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template if:false={hasDrillRows}>
                                <template if:false={isLoadingDrill}>
                                    <div class="slds-align_absolute-center slds-p-vertical_medium slds-text-color_weak">
                                        No records found for this filter and date range.
                                    </div>
                                </template>
                            </template>
                        </div>
                    </template>

                </template>
            </template>
        </div>
    </lightning-card>
</template>
